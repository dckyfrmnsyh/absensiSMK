<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi PKL • Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sync-manager.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .section { display: none; }
        .section.active { display: block; }
        
        .action-card {
            transition: all 0.2s ease;
        }
        .action-card:active {
            transform: scale(0.98);
        }
        
        .bottom-nav {
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }
        
        .stat-card {
            background-color: white;
            border: 1px solid #e2e8f0;
        }
        
        .modern-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .nav-active {
            color: #10b981;
            font-weight: 600;
        }
        
        .card {
            background: white;
            border: 1px solid #e2e8f0;
        }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; padding: 12px 24px; border-radius: 9999px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            max-width: 90%; text-align: center; font-weight: 500;
        }
        .toast-success { background-color: #059669; color: white; }
        .toast-warning { background-color: #d97706; color: white; }
        .toast-error { background-color: #dc2626; color: white; }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-[9999]"></div>

    <!-- Header -->
    <div class="modern-header sticky top-0 z-50 px-4 pt-4 pb-3">
        <div class="max-w-md mx-auto flex items-center justify-between">

                <h1 class="text-2xl font-bold text-slate-900" id="greeting">Halo, Siswa!</h1>
                <p class="text-sm text-slate-500" id="current-date"></p>
            </div>
            
            <div class="flex items-center gap-x-3">
                <div id="admin-status" class="hidden items-center gap-x-2 px-3 py-1 rounded-full bg-emerald-100 border border-emerald-200 text-xs">
                    <span class="text-emerald-700">👑 Admin</span>
                    <button onclick="logoutAdmin()" class="text-emerald-600 hover:text-emerald-800 text-xs">Logout</button>
                </div>
                
                <button onclick="showAdminLogin()" id="btn-admin-login"

                    <div class="text-xs text-slate-500">STATUS HARI INI</div>
                    <div id="status-text" class="text-3xl font-bold text-slate-900">Belum Absen</div>

                <div id="status-icon" class="text-5xl">😴</div>

        <!-- Action Cards -->
        <div class="space-y-4 mb-8" id="action-area"></div>

        <!-- Statistik Harian -->

            <div class="text-sm font-semibold text-slate-600 mb-3">Statistik Hari Ini</div>
            <div class="grid grid-cols-3 gap-3">
                <div class="stat-card rounded-3xl p-4 text-center">
                    <div class="text-2xl font-bold text-emerald-600" id="stat-hadir">0</div>
                    <div class="text-xs text-slate-500 mt-1">Hari Hadir</div>

                <div class="stat-card rounded-3xl p-4 text-center">
                    <div class="text-2xl font-bold text-emerald-600" id="stat-terlambat">0</div>
                    <div class="text-xs text-slate-500 mt-1">Terlambat</div>
                </div>
                <div class="stat-card rounded-3xl p-4 text-center">
                    <div class="text-2xl font-bold text-emerald-600" id="stat-kehadiran">0%</div>

            <div class="flex items-center gap-x-3 text-yellow-700">

        <!-- Sync Button -->
        <div class="mb-4">
            <button onclick="handleSync()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-2xl">☁️ Sync Sekarang</button>

        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-slate-900">Riwayat Absensi</h3>
            <button onclick="handleSync()" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-2xl">Sync</button>

    <!-- PROFIL -->

        <div class="card rounded-3xl p-6">
            <h3 class="text-xl font-bold mb-6 text-slate-900">Profil Siswa</h3>
            <div class="space-y-4">
                <div>

                    <input id="nama" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">

                <div class="grid grid-cols-2 gap-4">

                        <label class="text-xs text-slate-500">NIS</label>
                        <input id="nis" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">KELAS</label>
                        <input id="kelas" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-500">TEMPAT PKL</label>
                    <input id="tempat" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                </div>
            </div>
            <button onclick="saveProfile()" class="mt-6 w-full py-3.5 bg-emerald-600 text-white font-bold rounded-3xl">Simpan Profil</button>

    <!-- ADMIN -->
    <div id="section-admin" class="section max-w-md mx-auto px-4 pt-6 pb-24">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-slate-900">Panel Admin</h3>
            <div class="flex gap-x-2">
                <button onclick="loadAllAttendanceData()" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-2xl">Muat Ulang</button>
                <button onclick="exportToCSV()" class="px-4 py-2 bg-slate-200 text-sm font-medium rounded-2xl">Export CSV</button>
            </div>
        </div>
        <div class="mb-4">
            <div class="flex gap-x-2">
                <input type="text" id="admin-search" placeholder="Cari nama atau NIS..." 
                       class="flex-1 bg-white border border-slate-300 rounded-2xl px-4 py-2 text-sm" onkeyup="filterAdminData()">
                <input type="date" id="admin-date-filter" 
                       class="bg-white border border-slate-300 rounded-2xl px-4 py-2 text-sm"
                       onchange="filterAdminData()">
            </div>
        </div>
        <div class="card rounded-3xl overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-4 py-3 text-left">Tanggal</th>
                        <th class="px-4 py-3 text-left">Nama</th>
                        <th class="px-4 py-3 text-left">NIS / Kelas</th>
                        <th class="px-4 py-3 text-left">Jam</th>
                        <th class="px-4 py-3 text-left">Foto</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body" class="divide-y divide-slate-200"></tbody>
            </table>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 z-50 max-w-md mx-auto">
        <div class="bottom-nav px-2 py-2 flex justify-around items-center rounded-t-3xl">
            <button onclick="showSection('dashboard')" class="flex flex-col items-center px-4 py-1 text-xs nav-active" id="nav-dashboard">
                <span class="text-xl mb-0.5">🏠</span>
                <span>Home</span>
            </button>
            <button onclick="showSection('riwayat')" class="flex flex-col items-center px-4 py-1 text-xs text-slate-500" id="nav-riwayat">
                <span class="text-xl mb-0.5">📋</span>
                <span>Riwayat</span>
            </button>
            <button onclick="showSection('profil')" class="flex flex-col items-center px-4 py-1 text-xs text-slate-500" id="nav-profil">
                <span class="text-xl mb-0.5">👤</span>
                <span>Profil</span>
            </button>
            <button onclick="showAdminSection()" class="flex flex-col items-center px-4 py-1 text-xs text-slate-500" id="nav-admin">
                <span class="text-xl mb-0.5">⚙️</span>
                <span>Admin</span>
            </button>

    <!-- Admin Login Modal -->
    <div id="admin-login-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[999]">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm mx-4">
            <h3 class="text-xl font-bold mb-6 text-slate-900">Login Admin</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500">EMAIL</label>
                    <input id="admin-email" type="email" value="admin@sekolah.sch.id" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                </div>
                <div>
                    <label class="text-xs text-slate-500">PASSWORD</label>
                    <input id="admin-password" type="password" value="admin123" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                </div>
            </div>
            <div class="flex gap-x-3 mt-6">
                <button onclick="loginAsAdmin()" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-3xl">Login</button>
                <button onclick="hideAdminLogin()" class="flex-1 py-3 bg-slate-200 text-slate-700 rounded-3xl">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://hqoiqoqdqzkkssgoqhpj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxb2lxb3FkcXpra3NzZ29xaHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTQ4MzcsImV4cCI6MjA5NjYzMDg0MzcsImF1ZCI6ImF1dGhlbnRpY2F0ZWQiLCJlbWFpbCI6InB1YmxpYyJ9.2lOypI6pCX1W2DqJBPyXh1wJ1q1h2k3l4m5n6o7p8q';
        
        let supabaseClient = null;
        let profile = { nama: "Siswa PKL", nis: "", kelas: "", tempat_pkl: "" };
        let attendances = [];
        let currentUser = null;
        let isAdmin = false;
        let allAdminData = [];

        // ==================== TOAST ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = 'toast-success';
            if (type === 'warning') bgClass = 'toast-warning';
            if (type === 'error') bgClass = 'toast-error';
            
            toast.className = `toast ${bgClass} px-6 py-3 shadow-xl flex items-center gap-x-3`;
            toast.innerHTML = `
                <div class="flex-1 text-sm font-medium">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-white/70 hover:text-white text-xl leading-none">×</button>
            `;
            container.appendChild(toast);
            
            const timeout = type === 'error' ? 8000 : 4500;
            setTimeout(() => {
                if (toast.parentElement) toast.parentElement.removeChild(toast);
            }, timeout);
        }

        // ==================== HELPER ====================
        function formatTime(date) {
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function updateDate() {
            const el = document.getElementById('current-date');
            const today = new Date();
            el.textContent = today.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        // ==================== IMAGE COMPRESSION ====================
        async function compressImageToMaxSize(file, maxSizeMB = 5) {
            const maxSizeBytes = maxSizeMB * 1024 * 1024;
            let quality = 0.75;
            let maxWidth = 1024;

            let compressedBlob = await compressWithCanvas(file, maxWidth, quality);

            let attempts = 0;
            while (compressedBlob.size > maxSizeBytes && attempts < 10) {
                attempts++;
                if (quality > 0.4) {
                    quality -= 0.08;
                } else if (maxWidth > 480) {
                    maxWidth = Math.floor(maxWidth * 0.7);
                    quality = 0.65;
                } else {
                    quality = 0.4;
                }
                compressedBlob = await compressWithCanvas(file, maxWidth, quality);
            }
            return compressedBlob;
        }

        function compressWithCanvas(file, maxWidth, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d', { alpha: false });
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob || file);
                        }, 'image/jpeg', quality);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // ==================== GEOLOCATION ====================
        async function getCurrentLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ lat: null, lng: null });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                    () => resolve({ lat: null, lng: null }),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        // ==================== SUPABASE INIT + AUTH ====================
        function initSupabase() {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("%c[Supabase] Connected", "color:#3ecf8e");

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (session?.user) {
                    currentUser = session.user;
                    checkUserRole();
                } else {
                    currentUser = null;
                    isAdmin = false;
                    updateAdminUI();
                }
            });
        }

        async function checkUserRole() {
            if (!currentUser) return;

            try {
                const { data: profileData } = await supabaseClient
                    .from('profiles')
                    .select('role, nama, nis')
                    .eq('id', currentUser.id)
                    .single();

                if (profileData?.role === 'admin') {
                    isAdmin = true;
                    updateAdminUI();
                    showToast(`Selamat datang, Admin ${profileData.nama || ''}`, 'success');
                }
            } catch (err) {
                console.log("Profile not found or error checking role");
            }
        }

        function updateAdminUI() {
            const statusEl = document.getElementById('admin-status');
            const loginBtn = document.getElementById('btn-admin-login');

            if (isAdmin) {
                statusEl.classList.remove('hidden');
                statusEl.classList.add('flex');
                loginBtn.style.display = 'none';
            } else {
                statusEl.classList.add('hidden');
                statusEl.classList.remove('flex');
                loginBtn.style.display = 'block';
            }
        }

        async function loginAsAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();

            if (!email || !password) {
                showToast("Email dan password harus diisi", 'warning');
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                currentUser = data.user;
                hideAdminLogin();
                await checkUserRole();

            } catch (err) {
                console.error(err);
                showToast("Login gagal: " + (err.message || "Periksa email & password"), 'error');
            }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            isAdmin = false;
            currentUser = null;
            updateAdminUI();
            showSection('dashboard');
            showToast("Anda telah logout dari mode Admin.", 'success');
        }

        function showAdminLogin() {
            document.getElementById('admin-login-modal').classList.remove('hidden');
        }

        function hideAdminLogin() {
            document.getElementById('admin-login-modal').classList.add('hidden');
        }

        // ==================== LOAD DATA ====================
        function loadLocalData() {
            const savedProfile = localStorage.getItem('pkl_profile');
            if (savedProfile) profile = JSON.parse(savedProfile);

            const saved = localStorage.getItem('pkl_attendances');
            if (saved) attendances = JSON.parse(saved);
        }

        function saveLocalData() {
            localStorage.setItem('pkl_profile', JSON.stringify(profile));
            if (!window.saveAttendanceOfflineFirst) {
                localStorage.setItem('pkl_attendances', JSON.stringify(attendances));
            }
        }

        // ==================== SYNC ====================
        async function handleSync() {
            if (typeof window.syncPendingRecords === 'function') {
                const result = await window.syncPendingRecords();
                showToast(result.message || `${result.success} berhasil, ${result.failed} gagal`, 
                          result.failed > 0 ? 'warning' : 'success');
                
                if (typeof window.loadAttendanceData === 'function') {
                    attendances = await window.loadAttendanceData();
                    renderDashboard();
                    renderHistory();
                }
            } else {
                await syncToSupabase();
            }
        }

        async function syncToSupabase() {
            if (!supabaseClient || !navigator.onLine) {
                showToast("Tidak ada koneksi internet.", 'warning');
                return;
            }

            const unsynced = attendances.filter(a => !a.synced);
            if (unsynced.length === 0) {
                showToast("Semua data sudah tersinkron.", 'success');
                return;
            }

            let success = 0, failed = 0;

            for (const record of unsynced) {
                try {
                    const { error } = await supabaseClient.from('attendances').upsert({
                        id: record.id,
                        student_nis: profile.nis,
                        student_name: profile.nama,
                        tanggal: record.tanggal,
                        jam_masuk: record.jam_masuk,
                        jam_keluar: record.jam_keluar,
                        lat: record.lat,
                        lng: record.lng,
                        status_masuk: record.status_masuk,
                        photo_url: record.photo_url || null
                    });

                    if (!error) {
                        record.synced = true;
                        success++;
                    } else {
                        failed++;
                        console.error("Sync error:", error);
                    }
                } catch (e) {
                    failed++;
                }
            }

            saveLocalData();
            renderHistory();
            showToast(`${success} berhasil, ${failed} gagal.`, failed > 0 ? 'warning' : 'success');
        }

        async function loadFromSupabase() {
            if (!supabaseClient) return;

            try {
                let query = supabaseClient.from('attendances').select('*').order('tanggal', { ascending: false });

                if (currentUser && !isAdmin && profile.nis) {
                    query = query.eq('student_nis', profile.nis);
                }

                const { data, error } = await query;
                if (error) throw error;

                data.forEach(cloudRecord => {
                    const idx = attendances.findIndex(a => a.id === cloudRecord.id);
                    if (idx === -1) {
                        attendances.push({ ...cloudRecord, synced: true });
                    }
                });

                saveLocalData();
                renderHistory();
                showToast("Data berhasil dimuat dari Supabase.", 'success');
            } catch (e) {
                showToast("Gagal memuat data.", 'error');
            }
        }

        // ==================== ADMIN: LOAD ALL DATA ====================
        async function loadAllAttendanceData() {
            if (!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient
                    .from('attendances')
                    .select('*')
                    .order('tanggal', { ascending: false });

                if (error) throw error;

                allAdminData = data || [];
                renderAdminTable(allAdminData);
                showToast(`Berhasil memuat ${allAdminData.length} data.`, 'success');
            } catch (err) {
                console.error(err);
                showToast("Gagal memuat data admin. Pastikan RLS sudah benar.", 'error');
            }
        }

        function renderAdminTable(data) {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-slate-400">Tidak ada data</td></tr>`;
                return;
            }

            data.forEach(record => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 border-b border-slate-200';

                const hasLocation = record.lat && record.lng;
                const locationHTML = hasLocation 
                    ? `<a href="https://www.google.com/maps?q=${record.lat},${record.lng}" target="_blank" class="text-blue-600 hover:underline text-xs">Lihat</a>` 
                    : '-';

                const photoHTML = record.photo_url 
                    ? `<img src="${record.photo_url}" class="w-9 h-9 object-cover rounded cursor-pointer" onclick="showPhoto('${record.photo_url}')">` 
                    : '-';

                row.innerHTML = `
                    <td class="px-4 py-3">${record.tanggal}</td>
                    <td class="px-4 py-3 font-medium">${record.student_name || '-'}</td>
                    <td class="px-4 py-3 text-xs">${record.student_nis || ''} ${record.kelas ? '('+record.kelas+')' : ''}</td>
                    <td class="px-4 py-3 text-xs">${record.jam_masuk || ''} → ${record.jam_keluar || '-'}</td>
                    <td class="px-4 py-3">${photoHTML}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterAdminData() {
            const search = document.getElementById('admin-search').value.toLowerCase();
            const dateFilter = document.getElementById('admin-date-filter').value;

            let filtered = allAdminData;

            if (search) {
                filtered = filtered.filter(r => 
                    (r.student_name && r.student_name.toLowerCase().includes(search)) ||
                    (r.student_nis && r.student_nis.includes(search))
                );
            }

            if (dateFilter) {
                filtered = filtered.filter(r => r.tanggal === dateFilter);
            }

            renderAdminTable(filtered);
        }

        function exportToCSV() {
            if (!allAdminData.length) {
                showToast("Tidak ada data untuk diexport", 'warning');
                return;
            }

            let csv = "Tanggal,Nama Siswa,NIS,Kelas,Jam Masuk,Jam Keluar,Latitude,Longitude\n";
            allAdminData.forEach(r => {
                csv += `${r.tanggal},${r.student_name || ''},${r.student_nis || ''},${r.kelas || ''},${r.jam_masuk || ''},${r.jam_keluar || ''},${r.lat || ''},${r.lng || ''}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `absensi_semua_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // ==================== PHOTO ====================
        async function addPhoto() {
            const record = getTodayRecord();
            if (!record) {
                showToast("Absen dulu baru bisa tambah foto", 'warning');
                return;
            }

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const compressedBlob = await compressImageToMaxSize(file, 5);

                if (typeof window.saveAttendanceOfflineFirst === 'function') {
                    try {
                        await window.saveAttendanceOfflineFirst({
                            id: record.id,
                            tanggal: record.tanggal,
                            jam_masuk: record.jam_masuk,
                            jam_keluar: record.jam_keluar,
                            lat: record.lat,
                            lng: record.lng,
                            status_masuk: record.status_masuk,
                            student_nis: profile.nis,
                            student_name: profile.nama
                        }, compressedBlob);

                        showToast("Foto berhasil disimpan.", 'success');
                        if (typeof window.loadAttendanceData === 'function') {
                            attendances = await window.loadAttendanceData();
                            renderDashboard();
                            renderHistory();
                        }
                        return;
                    } catch (err) {
                        showToast("Gagal menyimpan foto.", 'error');
                    }
                }

                // Fallback
                if (navigator.onLine && supabaseClient) {
                    try {
                        const fileName = `absen-${record.id}-${Date.now()}.jpg`;
                        const { data, error } = await supabaseClient.storage.from('photos').upload(fileName, compressedBlob);
                        if (error) throw error;

                        const { data: urlData } = supabaseClient.storage.from('photos').getPublicUrl(fileName);
                        record.photo_url = urlData.publicUrl;
                        record.synced = false;
                        saveLocalData();
                        renderDashboard();
                        renderHistory();
                        showToast("Foto berhasil diupload!", 'success');
                        return;
                    } catch (err) {
                        showToast("Gagal upload foto.", 'error');
                    }
                }

                // Base64 fallback
                const reader = new FileReader();
                reader.onload = (ev) => {
                    record.pending_photo_base64 = ev.target.result;
                    record.synced = false;
                    saveLocalData();
                    renderDashboard();
                    renderHistory();
                    showToast("Foto disimpan lokal.", 'warning');
                };
                reader.readAsDataURL(compressedBlob);
            };

            input.click();
        }

        // ==================== ATTENDANCE ====================
        function getTodayRecord() {
            const today = new Date().toISOString().split('T')[0];
            return attendances.find(a => a.tanggal === today);
        }

        async function doCheckIn() {
            const today = new Date().toISOString().split('T')[0];
            if (getTodayRecord()) {
                showToast("Sudah absen hari ini", 'warning');
                return;
            }

            const now = new Date();
            const location = await getCurrentLocation();

            const recordData = {
                id: Date.now(),
                tanggal: today,
                jam_masuk: formatTime(now),
                jam_keluar: null,
                lat: location.lat,
                lng: location.lng,
                status_masuk: "Hadir",
                photo_url: null,
                synced: false
            };

            if (typeof window.saveAttendanceOfflineFirst === 'function') {
                await window.saveAttendanceOfflineFirst(recordData, null);
                if (typeof window.loadAttendanceData === 'function') {
                    attendances = await window.loadAttendanceData();
                }
            } else {
                attendances.unshift(recordData);
            }

            saveLocalData();
            renderDashboard();
            renderHistory();
            showToast("Absen masuk berhasil.", 'success');
        }

        async function doCheckOut() {
            const record = getTodayRecord();
            if (!record || record.jam_keluar) return;

            const now = new Date();
            const location = await getCurrentLocation();

            record.jam_keluar = formatTime(now);
            if (location.lat) {
                record.lat = location.lat;
                record.lng = location.lng;
            }
            record.synced = false;

            if (typeof window.saveAttendanceOfflineFirst === 'function') {
                await window.saveAttendanceOfflineFirst(record, null);
                if (typeof window.loadAttendanceData === 'function') {
                    attendances = await window.loadAttendanceData();
                }
            }

            saveLocalData();
            renderDashboard();
            renderHistory();
            showToast("Absen keluar berhasil.", 'success');
        }

        // ==================== RENDER ====================
        function renderDashboard() {
            const record = getTodayRecord();
            const statusText = document.getElementById('status-text');
            const actionArea = document.getElementById('action-area');
            const pendingInfo = document.getElementById('pending-info');
            actionArea.innerHTML = '';

            const hasPending = attendances.some(a => !a.synced || a.pending_photo_base64);
            pendingInfo.classList.toggle('hidden', !hasPending);

            if (!record) {
                statusText.textContent = "Belum Absen";
                actionArea.innerHTML = `
                    <button onclick="doCheckIn()" class="action-card w-full py-6 bg-emerald-600 text-white font-bold text-xl rounded-3xl flex items-center justify-center gap-x-3">
                        📍 ABSEN MASUK
                    </button>
                `;
            } else if (!record.jam_keluar) {
                statusText.textContent = "Sedang Bekerja";
                actionArea.innerHTML = `
                    <button onclick="doCheckOut()" class="action-card w-full py-6 bg-red-500 text-white font-bold text-xl rounded-3xl flex items-center justify-center gap-x-3 mb-3">
                        🛑 ABSEN KELUAR
                    </button>
                    <button onclick="addPhoto()" class="action-card w-full py-4 bg-white border border-slate-300 text-slate-700 font-medium rounded-3xl flex items-center justify-center gap-x-2">
                        📸 ${record.pending_photo_base64 ? 'Ganti Foto' : 'Tambah Foto'}
                    </button>
                `;
            } else {
                statusText.textContent = "Sudah Pulang";
                actionArea.innerHTML = `
                    <button onclick="addPhoto()" class="action-card w-full py-4 bg-white border border-slate-300 text-slate-700 font-medium rounded-3xl flex items-center justify-center gap-x-2">
                        📸 ${record.pending_photo_base64 ? 'Ganti Foto' : 'Tambah Foto'}
                    </button>
                `;
            }
            updateDailyStats();
        }

        function updateDailyStats() {
            const today = new Date().toISOString().split('T')[0];
            const todayRecords = attendances.filter(r => r.tanggal === today);
            document.getElementById('stat-hadir').textContent = todayRecords.length;
            document.getElementById('stat-terlambat').textContent = "0";
            document.getElementById('stat-kehadiran').textContent = todayRecords.length > 0 ? "100%" : "0%";
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';

            if (attendances.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-8">Belum ada riwayat</p>`;
                return;
            }

            attendances.forEach(record => {
                const div = document.createElement('div');
                div.className = 'card rounded-3xl p-5';
                const isPending = !record.synced || record.pending_photo_base64;
                const hasLocation = record.lat && record.lng;

                div.innerHTML = `
                    <div class="flex justify-between">
                        <div>
                            <div class="font-semibold">${record.tanggal}</div>
                            <div class="text-sm text-emerald-600">${record.jam_masuk || ''} ${record.jam_keluar ? '→ ' + record.jam_keluar : ''}</div>
                            ${hasLocation ? `<div class="text-xs text-blue-500 mt-1">📍 Lokasi tercatat</div>` : ''}
                        </div>
                        <div class="text-xs px-3 py-1 rounded-full ${isPending ? 'bg-yellow-100 text-yellow-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${isPending ? 'PENDING' : 'SYNCED'}
                        </div>
                    </div>
                    ${record.photo_url ? `<img src="${record.photo_url}" class="mt-3 w-16 h-16 object-cover rounded-2xl border border-slate-300 cursor-pointer" onclick="showPhoto('${record.photo_url}')">` : ''}
                `;
                container.appendChild(div);
            });
        }

        function showPhoto(url) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[100]';
            modal.innerHTML = `
                <div class="max-w-lg w-full p-4">
                    <img src="${url}" class="w-full rounded-3xl">
                    <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full py-3 bg-white rounded-2xl text-slate-900 font-bold">Tutup</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(`section-${section}`).classList.add('active');

            document.querySelectorAll('[id^="nav-"]').forEach(el => el.classList.remove('nav-active', 'text-emerald-600'));
            document.querySelectorAll('[id^="nav-"]').forEach(el => el.classList.add('text-slate-500'));
            
            const activeNav = document.getElementById(`nav-${section}`);
            if (activeNav) {
                activeNav.classList.add('nav-active', 'text-emerald-600');
                activeNav.classList.remove('text-slate-500');
            }

            if (section === 'riwayat') renderHistory();
            if (section === 'admin' && isAdmin && allAdminData.length === 0) {
                loadAllAttendanceData();
            }
        }

        async function showAdminSection() {
            if (!isAdmin) {
                showAdminLogin();
                return;
            }
            showSection('admin');
            if (allAdminData.length === 0) {
                await loadAllAttendanceData();
            }
        }

        function saveProfile() {
            profile.nama = document.getElementById('nama').value.trim();
            profile.nis = document.getElementById('nis').value.trim();
            profile.kelas = document.getElementById('kelas').value.trim();
            profile.tempat_pkl = document.getElementById('tempat').value.trim();
            saveLocalData();

            if (typeof window.initSyncManager === 'function' && supabaseClient) {
                window.initSyncManager(supabaseClient, profile);
            }
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            showToast("Profil berhasil disimpan.", 'success');
        }

        function updateGreeting() {
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            document.getElementById('nama').value = profile.nama || '';
            document.getElementById('nis').value = profile.nis || '';
            document.getElementById('kelas').value = profile.kelas || '';
            document.getElementById('tempat').value = profile.tempat_pkl || '';
        }

        // ==================== INIT ====================
        async function initApp() {
            initSupabase();
            loadLocalData();
            updateGreeting();
            updateDate();
            renderDashboard();
            renderHistory();

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                currentUser = session.user;
                await checkUserRole();
            }

            setTimeout(() => {
                showToast("Aplikasi siap. Admin bisa login untuk melihat semua data.", 'success');
            }, 1500);
        }

        window.onload = initApp;
    </script>
</body>
</html>
