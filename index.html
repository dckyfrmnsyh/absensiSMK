<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi PKL • Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .section { display: none; }
        .section.active { display: block; }
        
        .action-card {
            transition: all 0.2s ease;
        }
        .action-card:active {
            transform: scale(0.98);
        }
        
        .bottom-nav {
            background-color: white;
            border-top: 1px solid #e2e8f0;
        }
        
        .stat-card {
            background-color: white;
            border: 1px solid #e2e8f0;
        }
        
        .modern-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .nav-active {
            color: #10b981;
            font-weight: 600;
        }
        
        .card {
            background: white;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="modern-header sticky top-0 z-50 px-4 pt-4 pb-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-900" id="greeting">Halo, Siswa!</h1>
                <p class="text-sm text-slate-500" id="current-date"></p>
            </div>
            
            <div class="flex items-center gap-x-3">
                <div id="admin-status" class="hidden items-center gap-x-2 px-3 py-1 rounded-full bg-emerald-100 border border-emerald-200 text-xs">
                    <span class="text-emerald-700">👑 Admin</span>
                    <button onclick="logoutAdmin()" class="text-emerald-600 hover:text-emerald-800 text-xs">Logout</button>
                </div>
                
                <button onclick="showAdminLogin()" id="btn-admin-login"
                        class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full font-medium transition-colors">
                    Admin
                </button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="section-dashboard" class="section active max-w-md mx-auto px-4 pt-6 pb-24">
        
        <!-- Status -->
        <div class="mb-6">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <div class="text-xs text-slate-500">STATUS HARI INI</div>
                    <div id="status-text" class="text-3xl font-bold text-slate-900">Belum Absen</div>
                </div>
                <div id="status-icon" class="text-5xl">😴</div>
            </div>
        </div>

        <!-- Action Cards -->
        <div class="space-y-4 mb-8" id="action-area"></div>

        <!-- Statistik Harian -->
        <div class="mb-6">
            <div class="text-sm font-semibold text-slate-600 mb-3">Statistik Hari Ini</div>
            <div class="grid grid-cols-3 gap-3">
                <div class="stat-card rounded-3xl p-4 text-center">
                    <div class="text-2xl font-bold text-emerald-600" id="stat-hadir">0</div>
                    <div class="text-xs text-slate-500 mt-1">Hari Hadir</div>
                </div>
                <div class="stat-card rounded-3xl p-4 text-center">
                    <div class="text-2xl font-bold text-emerald-600" id="stat-terlambat">0</div>
                    <div class="text-xs text-slate-500 mt-1">Terlambat</div>
                </div>
                <div class="stat-card rounded-3xl p-4 text-center">
                    <div class="text-2xl font-bold text-emerald-600" id="stat-kehadiran">0%</div>
                    <div class="text-xs text-slate-500 mt-1">Kehadiran</div>
                </div>
            </div>
        </div>

        <div id="pending-info" class="hidden mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-3xl text-sm">
            <div class="flex items-center gap-x-3 text-yellow-700">
                <span>📸</span>
                <span>Ada data pending. Tekan tombol Sync.</span>
            </div>
        </div>
    </div>

    <!-- RIWAYAT -->
    <div id="section-riwayat" class="section max-w-md mx-auto px-4 pt-6 pb-24">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-slate-900">Riwayat Absensi</h3>
            <button onclick="handleSync()" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-2xl">Sync</button>
        </div>
        <div id="history-list" class="space-y-3"></div>
    </div>

    <!-- PROFIL -->
    <div id="section-profil" class="section max-w-md mx-auto px-4 pt-6 pb-24">
        <div class="card rounded-3xl p-6">
            <h3 class="text-xl font-bold mb-6 text-slate-900">Profil Siswa</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500">NAMA LENGKAP</label>
                    <input id="nama" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-500">NIS</label>
                        <input id="nis" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">KELAS</label>
                        <input id="kelas" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-500">TEMPAT PKL</label>
                    <input id="tempat" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                </div>
            </div>
            <button onclick="saveProfile()" class="mt-6 w-full py-3.5 bg-emerald-600 text-white font-bold rounded-3xl">Simpan Profil</button>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="section-admin" class="section max-w-md mx-auto px-4 pt-6 pb-24">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-slate-900">Panel Admin</h3>
            <div class="flex gap-x-2">
                <button onclick="loadAllAttendanceData()" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-2xl">Muat Ulang</button>
                <button onclick="exportToCSV()" class="px-4 py-2 bg-slate-200 text-sm font-medium rounded-2xl">Export CSV</button>
            </div>
        </div>
        <div class="mb-4">
            <input type="text" id="admin-search" placeholder="Cari nama atau NIS..." 
                   class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-2 text-sm" onkeyup="filterAdminData()">
        </div>
        <div class="card rounded-3xl overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-4 py-3 text-left">Tanggal</th>
                        <th class="px-4 py-3 text-left">Nama</th>
                        <th class="px-4 py-3 text-left">Jam</th>
                        <th class="px-4 py-3 text-left">Foto</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body" class="divide-y divide-slate-200"></tbody>
            </table>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 z-50 max-w-md mx-auto">
        <div class="bottom-nav px-2 py-2 flex justify-around items-center rounded-t-3xl">
            <button onclick="showSection('dashboard')" class="flex flex-col items-center px-4 py-1 text-xs nav-active" id="nav-dashboard">
                <span class="text-xl mb-0.5">🏠</span>
                <span>Home</span>
            </button>
            <button onclick="showSection('riwayat')" class="flex flex-col items-center px-4 py-1 text-xs text-slate-500" id="nav-riwayat">
                <span class="text-xl mb-0.5">📋</span>
                <span>Riwayat</span>
            </button>
            <button onclick="showSection('profil')" class="flex flex-col items-center px-4 py-1 text-xs text-slate-500" id="nav-profil">
                <span class="text-xl mb-0.5">👤</span>
                <span>Profil</span>
            </button>
            <button onclick="showAdminSection()" class="flex flex-col items-center px-4 py-1 text-xs text-slate-500" id="nav-admin">
                <span class="text-xl mb-0.5">⚙️</span>
                <span>Admin</span>
            </button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="admin-login-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[999]">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm mx-4">
            <h3 class="text-xl font-bold mb-6 text-slate-900">Login Admin</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-500">EMAIL</label>
                    <input id="admin-email" type="email" value="admin@sekolah.sch.id" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                </div>
                <div>
                    <label class="text-xs text-slate-500">PASSWORD</label>
                    <input id="admin-password" type="password" value="admin123" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3 mt-1">
                </div>
            </div>
            <div class="flex gap-x-3 mt-6">
                <button onclick="loginAsAdmin()" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-3xl">Login</button>
                <button onclick="hideAdminLogin()" class="flex-1 py-3 bg-slate-200 text-slate-700 rounded-3xl">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE CONFIG
        const SUPABASE_URL = 'https://hqoiqoqdqzkkssgoqhpj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxb2lxb3FkcXpra3NzZ29xaHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTQ4MzcsImV4cCI6MjA5NjYzMDgzN30.8KRYBV-t47ca08Q8G4yqn3bfVLPFEE9PDIrtAfbpVnE';
        
        let supabaseClient = null;
        let profile = { nama: "Siswa PKL", nis: "", kelas: "", tempat_pkl: "" };
        let attendances = [];
        let currentUser = null;
        let isAdmin = false;
        let allAdminData = [];

        function formatTime(date) {
            return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function updateDate() {
            const el = document.getElementById('current-date');
            const today = new Date();
            el.textContent = today.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        // KOMPRESI FOTO
        async function compressImageToMaxSize(file, maxSizeMB = 5) {
            const maxSizeBytes = maxSizeMB * 1024 * 1024;
            let quality = 0.75, maxWidth = 1024;
            let compressedBlob = await compressWithCanvas(file, maxWidth, quality);
            let attempts = 0;
            while (compressedBlob.size > maxSizeBytes && attempts < 10) {
                attempts++;
                if (quality > 0.4) quality -= 0.08;
                else if (maxWidth > 480) { maxWidth = Math.floor(maxWidth * 0.7); quality = 0.65; }
                else quality = 0.4;
                compressedBlob = await compressWithCanvas(file, maxWidth, quality);
            }
            return compressedBlob;
        }

        function compressWithCanvas(file, maxWidth, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d', { alpha: false });
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => resolve(blob || file), 'image/jpeg', quality);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function getCurrentLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) return resolve({ lat: null, lng: null });
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                    () => resolve({ lat: null, lng: null }),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        function initSupabase() {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (session?.user) {
                    currentUser = session.user;
                    checkUserRole();
                } else {
                    currentUser = null; isAdmin = false; updateAdminUI();
                }
            });
        }

        async function checkUserRole() {
            if (!currentUser) return;
            try {
                const { data } = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).single();
                if (data?.role === 'admin') { isAdmin = true; updateAdminUI(); }
            } catch (e) {}
        }

        function updateAdminUI() {
            const status = document.getElementById('admin-status');
            const btn = document.getElementById('btn-admin-login');
            if (isAdmin) {
                status.classList.remove('hidden'); status.classList.add('flex');
                btn.style.display = 'none';
            } else {
                status.classList.add('hidden'); status.classList.remove('flex');
                btn.style.display = 'block';
            }
        }

        async function loginAsAdmin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
                if (error) throw error;
                currentUser = data.user;
                hideAdminLogin();
                await checkUserRole();
            } catch (err) { alert("Login gagal: " + err.message); }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            isAdmin = false; currentUser = null; updateAdminUI(); showSection('dashboard');
        }

        function showAdminLogin() { document.getElementById('admin-login-modal').classList.remove('hidden'); }
        function hideAdminLogin() { document.getElementById('admin-login-modal').classList.add('hidden'); }

        function loadLocalData() {
            const saved = localStorage.getItem('pkl_profile');
            if (saved) profile = JSON.parse(saved);
            const att = localStorage.getItem('pkl_attendances');
            if (att) attendances = JSON.parse(att);
        }

        function saveLocalData() {
            localStorage.setItem('pkl_profile', JSON.stringify(profile));
        }

        async function handleSync() {
            alert("Fitur sync masih disederhanakan di versi ini.");
        }

        async function addPhoto() {
            const record = getTodayRecord();
            if (!record) { alert("Absen dulu baru bisa tambah foto"); return; }
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
            input.onchange = async (e) => {
                const file = e.target.files[0]; if (!file) return;
                const blob = await compressImageToMaxSize(file, 5);
                const reader = new FileReader();
                reader.onload = (ev) => {
                    record.pending_photo_base64 = ev.target.result;
                    record.synced = false;
                    saveLocalData();
                    renderDashboard();
                    alert("Foto berhasil disimpan.");
                };
                reader.readAsDataURL(blob);
            };
            input.click();
        }

        function getTodayRecord() {
            const today = new Date().toISOString().split('T')[0];
            return attendances.find(a => a.tanggal === today);
        }

        async function doCheckIn() {
            const today = new Date().toISOString().split('T')[0];
            if (getTodayRecord()) { alert("Sudah absen hari ini"); return; }
            const now = new Date();
            const loc = await getCurrentLocation();
            const record = {
                id: Date.now(), tanggal: today, jam_masuk: formatTime(now), jam_keluar: null,
                lat: loc.lat, lng: loc.lng, status_masuk: "Hadir", synced: false
            };
            attendances.unshift(record);
            saveLocalData();
            renderDashboard();
            alert("Absen masuk berhasil!");
        }

        async function doCheckOut() {
            const record = getTodayRecord();
            if (!record || record.jam_keluar) return;
            const now = new Date();
            const loc = await getCurrentLocation();
            record.jam_keluar = formatTime(now);
            if (loc.lat) { record.lat = loc.lat; record.lng = loc.lng; }
            record.synced = false;
            saveLocalData();
            renderDashboard();
            alert("Absen keluar berhasil!");
        }

        function renderDashboard() {
            const record = getTodayRecord();
            const statusText = document.getElementById('status-text');
            const actionArea = document.getElementById('action-area');
            const pendingInfo = document.getElementById('pending-info');
            actionArea.innerHTML = '';

            const hasPending = attendances.some(a => !a.synced || a.pending_photo_base64);
            pendingInfo.classList.toggle('hidden', !hasPending);

            if (!record) {
                statusText.textContent = "Belum Absen";
                actionArea.innerHTML = `
                    <button onclick="doCheckIn()" class="action-card w-full py-6 bg-emerald-600 text-white font-bold text-xl rounded-3xl flex items-center justify-center gap-x-3">
                        📍 ABSEN MASUK
                    </button>
                `;
            } else if (!record.jam_keluar) {
                statusText.textContent = "Sedang Bekerja";
                actionArea.innerHTML = `
                    <button onclick="doCheckOut()" class="action-card w-full py-6 bg-red-500 text-white font-bold text-xl rounded-3xl flex items-center justify-center gap-x-3 mb-3">
                        🛑 ABSEN KELUAR
                    </button>
                    <button onclick="addPhoto()" class="action-card w-full py-4 bg-white border border-slate-300 text-slate-700 font-medium rounded-3xl flex items-center justify-center gap-x-2">
                        📸 ${record.pending_photo_base64 ? 'Ganti Foto' : 'Tambah Foto'}
                    </button>
                `;
            } else {
                statusText.textContent = "Sudah Pulang";
                actionArea.innerHTML = `
                    <button onclick="addPhoto()" class="action-card w-full py-4 bg-white border border-slate-300 text-slate-700 font-medium rounded-3xl flex items-center justify-center gap-x-2">
                        📸 ${record.pending_photo_base64 ? 'Ganti Foto' : 'Tambah Foto'}
                    </button>
                `;
            }
            updateDailyStats();
        }

        function updateDailyStats() {
            const today = new Date().toISOString().split('T')[0];
            const todayRecords = attendances.filter(r => r.tanggal === today);
            document.getElementById('stat-hadir').textContent = todayRecords.length;
            document.getElementById('stat-terlambat').textContent = "0";
            document.getElementById('stat-kehadiran').textContent = todayRecords.length > 0 ? "100%" : "0%";
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            if (attendances.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-8">Belum ada riwayat</p>`;
                return;
            }
            attendances.forEach(record => {
                const div = document.createElement('div');
                div.className = 'card rounded-3xl p-5';
                div.innerHTML = `
                    <div class="flex justify-between">
                        <div>
                            <div class="font-semibold">${record.tanggal}</div>
                            <div class="text-sm text-emerald-600">${record.jam_masuk || ''} ${record.jam_keluar ? '→ ' + record.jam_keluar : ''}</div>
                        </div>
                        <div class="text-xs px-3 py-1 rounded-full ${record.synced ? 'bg-emerald-100 text-emerald-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${record.synced ? 'SYNCED' : 'PENDING'}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(`section-${section}`).classList.add('active');

            document.querySelectorAll('[id^="nav-"]').forEach(el => el.classList.remove('nav-active', 'text-emerald-600'));
            document.querySelectorAll('[id^="nav-"]').forEach(el => el.classList.add('text-slate-500'));
            
            const activeNav = document.getElementById(`nav-${section}`);
            if (activeNav) {
                activeNav.classList.add('nav-active', 'text-emerald-600');
                activeNav.classList.remove('text-slate-500');
            }

            if (section === 'riwayat') renderHistory();
            if (section === 'admin' && isAdmin) loadAllAttendanceData();
        }

        async function showAdminSection() {
            if (!isAdmin) { showAdminLogin(); return; }
            showSection('admin');
            if (allAdminData.length === 0) await loadAllAttendanceData();
        }

        function saveProfile() {
            profile.nama = document.getElementById('nama').value.trim();
            profile.nis = document.getElementById('nis').value.trim();
            profile.kelas = document.getElementById('kelas').value.trim();
            profile.tempat_pkl = document.getElementById('tempat').value.trim();
            saveLocalData();
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            alert("Profil berhasil disimpan");
        }

        function updateGreeting() {
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            document.getElementById('nama').value = profile.nama || '';
            document.getElementById('nis').value = profile.nis || '';
            document.getElementById('kelas').value = profile.kelas || '';
            document.getElementById('tempat').value = profile.tempat_pkl || '';
        }

        async function loadAllAttendanceData() {
            if (!supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('attendances').select('*').order('tanggal', { ascending: false });
                allAdminData = data || [];
                renderAdminTable(allAdminData);
            } catch (e) { alert("Gagal memuat data admin"); }
        }

        function renderAdminTable(data) {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">Tidak ada data</td></tr>`;
                return;
            }
            data.forEach(r => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-3">${r.tanggal}</td>
                    <td class="px-4 py-3">${r.student_name || '-'}</td>
                    <td class="px-4 py-3 text-xs">${r.jam_masuk || ''} → ${r.jam_keluar || ''}</td>
                    <td class="px-4 py-3">${r.photo_url ? '📷' : '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterAdminData() {
            const q = document.getElementById('admin-search').value.toLowerCase();
            const filtered = allAdminData.filter(r => 
                (r.student_name && r.student_name.toLowerCase().includes(q)) || (r.student_nis && r.student_nis.includes(q))
            );
            renderAdminTable(filtered);
        }

        function exportToCSV() {
            if (!allAdminData.length) return alert("Tidak ada data");
            let csv = "Tanggal,Nama,NIS,Jam Masuk,Jam Keluar\n";
            allAdminData.forEach(r => {
                csv += `${r.tanggal},${r.student_name || ''},${r.student_nis || ''},${r.jam_masuk || ''},${r.jam_keluar || ''}\n`;
            });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
            a.download = `absensi_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        async function initApp() {
            initSupabase();
            loadLocalData();
            updateGreeting();
            updateDate();
            renderDashboard();
            renderHistory();

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                currentUser = session.user;
                await checkUserRole();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
