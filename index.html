<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi PKL • Supabase (Maksimal 2MB per Foto)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    
        <!-- Untuk performa terbaik: -->
        <script src="sync-manager.js"></script>
   
    
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .section { display: none; }
        .section.active { display: block; }
        .nav-tab.active { background-color: #22c55e; color: #0f172a; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <!-- Header -->
    <div class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-xl">📍</div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Absensi PKL</h1>
                    <p class="text-emerald-400 text-xs -mt-1">Supabase + Maks 2MB/Foto</p>
                </div>
            </div>
            <div class="flex items-center gap-x-2">
                <div id="sync-status" class="text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700 flex items-center gap-x-1.5">
                    <span id="sync-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span id="sync-text">Offline</span>
                </div>
                <button onclick="handleSync()" class="text-xs px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-full flex items-center gap-x-1.5 font-medium transition-colors">
                    <span>☁️ Sync</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="max-w-5xl mx-auto px-4 pt-4">
        <div class="flex bg-slate-900 rounded-3xl p-1 border border-slate-800">
            <button onclick="showSection('dashboard')" class="nav-tab flex-1 py-3 text-sm font-bold rounded-3xl active bg-emerald-500 text-slate-900" id="tab-dashboard">Dashboard</button>
            <button onclick="showSection('riwayat')" class="nav-tab flex-1 py-3 text-sm font-bold rounded-3xl text-slate-400" id="tab-riwayat">Riwayat</button>
            <button onclick="showSection('profil')" class="nav-tab flex-1 py-3 text-sm font-bold rounded-3xl text-slate-400" id="tab-profil">Profil</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="section-dashboard" class="section active max-w-5xl mx-auto px-4 pt-6">
        <div class="mb-6">
            <h2 id="greeting" class="text-3xl font-bold">Halo, Siswa!</h2>
            <p class="text-emerald-400 text-sm">Foto otomatis dikompresi maksimal <strong>2MB</strong>.</p>
        </div>

        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 mb-6">
            <div class="flex justify-between mb-4">
                <div>
                    <div class="text-xs text-emerald-400">STATUS HARI INI</div>
                    <div id="status-text" class="text-2xl font-bold">Belum Absen</div>
                </div>
                <div id="status-icon" class="text-5xl">😴</div>
            </div>
            <div id="action-area" class="space-y-3"></div>
            
            <div id="pending-info" class="hidden mt-4 p-3 bg-amber-900/30 border border-amber-700 rounded-2xl text-sm">
                <div class="flex items-center gap-x-2 text-amber-400">
                    <span>📸</span>
                    <span id="pending-text">Ada data/foto pending. Tekan Sync.</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="handleSync()" class="py-4 bg-emerald-500 hover:bg-emerald-600 text-emerald-950 font-bold rounded-3xl text-lg flex items-center justify-center gap-x-2 transition-all">
                ☁️ Sync ke Supabase
            </button>
            <button onclick="loadFromSupabase()" class="py-4 bg-slate-800 border border-slate-700 hover:bg-slate-700 font-bold rounded-3xl text-lg flex items-center justify-center gap-x-2 transition-all">
                📥 Ambil dari Cloud
            </button>
        </div>
    </div>

    <!-- RIWAYAT -->
    <div id="section-riwayat" class="section max-w-5xl mx-auto px-4 pt-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-2xl font-bold">Riwayat Absensi</h3>
            <button onclick="handleSync()" class="text-xs px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-medium">Sync Sekarang</button>
        </div>
        <div id="history-list" class="space-y-3"></div>
    </div>

    <!-- PROFIL -->
    <div id="section-profil" class="section max-w-5xl mx-auto px-4 pt-6">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6">
            <h3 class="text-xl font-bold mb-6">Profil Siswa</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-emerald-400">NAMA LENGKAP</label>
                    <input id="nama" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-emerald-400">NIS</label>
                        <input id="nis" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-emerald-400">KELAS</label>
                        <input id="kelas" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-emerald-400">TEMPAT PKL</label>
                    <input id="tempat" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                </div>
            </div>

            <button onclick="saveProfile()" class="mt-6 w-full py-4 bg-emerald-500 text-emerald-950 font-bold rounded-3xl">
                Simpan Profil
            </button>
        </div>
    </div>

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://hqoiqoqdqzkkssgoqhpj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxb2lxb3FkcXpra3NzZ29xaHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTQ4MzcsImV4cCI6MjA5NjYzMDgzN30.8KRYBV-t47ca08Q8G4yqn3bfVLPFEE9PDIrtAfbpVnE';
        
        let supabaseClient = null;
        let profile = { nama: "Siswa PKL", nis: "", kelas: "", tempat_pkl: "" };
        let attendances = [];

        // ==================== HELPER ====================
        function formatTime(date) {
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        // ==================== KOMPRESI FOTO MAKSIMAL 2MB ====================
        async function compressImageToMaxSize(file, maxSizeMB = 2) {
            const maxSizeBytes = maxSizeMB * 1024 * 1024;
            let quality = 0.85;
            let maxWidth = 1280;

            // Pertama, coba resize + kualitas sedang
            let compressedBlob = await compressWithCanvas(file, maxWidth, quality);

            // Jika masih terlalu besar, turunkan kualitas dan ukuran secara bertahap
            let attempts = 0;
            while (compressedBlob.size > maxSizeBytes && attempts < 8) {
                attempts++;

                if (quality > 0.5) {
                    quality -= 0.1;
                } else if (maxWidth > 640) {
                    maxWidth = Math.floor(maxWidth * 0.75);
                    quality = 0.75;
                } else {
                    // Jika masih besar, paksa kualitas rendah
                    quality = 0.5;
                }

                compressedBlob = await compressWithCanvas(file, maxWidth, quality);
            }

            console.log(`Foto akhir: ${(compressedBlob.size / 1024 / 1024).toFixed(2)} MB (target ≤ ${maxSizeMB}MB)`);
            return compressedBlob;
        }

        function compressWithCanvas(file, maxWidth, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d', { alpha: false });
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob || file);
                        }, 'image/jpeg', quality);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // ==================== INIT ====================
        function initSupabase() {
            if (typeof window.supabase === 'undefined') return;
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("%c[Supabase] Connected", "color:#3ecf8e");
        }

        function loadLocalData() {
            const savedProfile = localStorage.getItem('pkl_profile');
            if (savedProfile) profile = JSON.parse(savedProfile);

            if (typeof window.loadAttendanceData === 'function') {
                window.loadAttendanceData().then(data => {
                    attendances = data || [];
                    renderDashboard();
                    renderHistory();
                });
            } else {
                const saved = localStorage.getItem('pkl_attendances');
                if (saved) attendances = JSON.parse(saved);
            }
        }

        function saveLocalData() {
            localStorage.setItem('pkl_profile', JSON.stringify(profile));
            if (!window.saveAttendanceOfflineFirst) {
                localStorage.setItem('pkl_attendances', JSON.stringify(attendances));
            }
        }

        function updateNetworkStatus() {
            const statusEl = document.getElementById('sync-status');
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');

            if (navigator.onLine) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                text.textContent = 'Online';
                statusEl.className = 'text-xs px-3 py-1 rounded-full bg-emerald-900/50 border border-emerald-700 flex items-center gap-x-1.5';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400';
                text.textContent = 'Offline';
                statusEl.className = 'text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700 flex items-center gap-x-1.5';
            }
        }

        // ==================== SYNC ====================
        async function handleSync() {
            if (typeof window.syncPendingRecords === 'function') {
                const result = await window.syncPendingRecords();
                alert(result.message || `${result.success} berhasil, ${result.failed} gagal`);
                if (typeof window.loadAttendanceData === 'function') {
                    attendances = await window.loadAttendanceData();
                    renderDashboard();
                    renderHistory();
                }
            } else {
                await syncToSupabase();
            }
        }

        async function syncToSupabase() {
            if (!supabaseClient || !navigator.onLine) return;

            const unsynced = attendances.filter(a => !a.synced);
            if (unsynced.length === 0) {
                alert("Semua data sudah tersinkron.");
                return;
            }

            let success = 0, failed = 0;

            for (const record of unsynced) {
                try {
                    const { error } = await supabaseClient.from('attendances').upsert({
                        id: record.id,
                        student_nis: profile.nis,
                        student_name: profile.nama,
                        tanggal: record.tanggal,
                        jam_masuk: record.jam_masuk,
                        jam_keluar: record.jam_keluar,
                        lat: record.lat,
                        lng: record.lng,
                        status_masuk: record.status_masuk,
                        photo_url: record.photo_url || null
                    });
                    if (!error) {
                        record.synced = true;
                        success++;
                    } else failed++;
                } catch (e) {
                    failed++;
                }
            }
            saveLocalData();
            renderHistory();
            alert(`${success} berhasil, ${failed} gagal.`);
        }

        async function loadFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('attendances').select('*').order('tanggal', { ascending: false });
                data.forEach(cloudRecord => {
                    const idx = attendances.findIndex(a => a.id === cloudRecord.id);
                    if (idx === -1) attendances.push({ ...cloudRecord, synced: true });
                });
                saveLocalData();
                renderHistory();
            } catch (e) {}
        }

        // ==================== PHOTO DENGAN KOMPRESI MAKS 2MB ====================
        async function addPhoto() {
            const record = getTodayRecord();
            if (!record) {
                alert("Absen dulu baru bisa tambah foto");
                return;
            }

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Kompresi dengan target maksimal 2MB
                const compressedBlob = await compressImageToMaxSize(file, 2);

                if (typeof window.saveAttendanceOfflineFirst === 'function') {
                    try {
                        await window.saveAttendanceOfflineFirst({
                            id: record.id,
                            tanggal: record.tanggal,
                            jam_masuk: record.jam_masuk,
                            jam_keluar: record.jam_keluar,
                            lat: record.lat,
                            lng: record.lng,
                            status_masuk: record.status_masuk,
                            student_nis: profile.nis,
                            student_name: profile.nama
                        }, compressedBlob);

                        alert("Foto berhasil disimpan (≤ 2MB).");
                        if (typeof window.loadAttendanceData === 'function') {
                            attendances = await window.loadAttendanceData();
                            renderDashboard();
                            renderHistory();
                        }
                        return;
                    } catch (err) {
                        console.error(err);
                    }
                }

                // Fallback
                if (navigator.onLine && supabaseClient) {
                    try {
                        const fileName = `absen-${record.id}-${Date.now()}.jpg`;
                        const { data, error } = await supabaseClient.storage.from('photos').upload(fileName, compressedBlob);
                        if (error) throw error;

                        const { data: urlData } = supabaseClient.storage.from('photos').getPublicUrl(fileName);
                        record.photo_url = urlData.publicUrl;
                        record.synced = false;
                        saveLocalData();
                        renderDashboard();
                        renderHistory();
                        alert("Foto berhasil diupload (≤ 2MB)!");
                        return;
                    } catch (err) {
                        console.warn("Upload gagal");
                    }
                }

                // Base64 fallback
                const reader = new FileReader();
                reader.onload = (ev) => {
                    record.pending_photo_base64 = ev.target.result;
                    record.synced = false;
                    saveLocalData();
                    renderDashboard();
                    renderHistory();
                    alert("Foto disimpan lokal.");
                };
                reader.readAsDataURL(compressedBlob);
            };

            input.click();
        }

        // ==================== ATTENDANCE ====================
        function getTodayRecord() {
            const today = new Date().toISOString().split('T')[0];
            return attendances.find(a => a.tanggal === today);
        }

       async function doCheckIn() {
            const today = new Date().toISOString().split('T')[0];
            if (getTodayRecord()) {
                alert("Sudah absen hari ini");
                return;
            }

            const now = new Date();
            const recordData = {
                id: Date.now(),
                tanggal: today,
                jam_masuk: now.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    hour12: false 
                }).replace('.', ':'),
                jam_keluar: null,
                lat: null,
                lng: null,
                status_masuk: "Hadir",
                photo_url: null,
                synced: false
            };

            if (typeof window.saveAttendanceOfflineFirst === 'function') {
                await window.saveAttendanceOfflineFirst(recordData, null);
                if (typeof window.loadAttendanceData === 'function') {
                    attendances = await window.loadAttendanceData();
                }
            } else {
                attendances.unshift(recordData);
            }

            saveLocalData();
            renderDashboard();
            renderHistory();
        }

        async function doCheckOut() {
            const record = getTodayRecord();
            if (!record || record.jam_keluar) return;

            const now = new Date();
            // GANTI DENGAN INI:
            const pad = n => n.toString().padStart(2, '0');
            record.jam_keluar = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            record.synced = false;

            if (typeof window.saveAttendanceOfflineFirst === 'function') {
                await window.saveAttendanceOfflineFirst(record, null);
                if (typeof window.loadAttendanceData === 'function') {
                    attendances = await window.loadAttendanceData();
                }
            }

            saveLocalData();
            renderDashboard();
            renderHistory();
        }

        // ==================== RENDER ====================
        function renderDashboard() {
            const record = getTodayRecord();
            const statusText = document.getElementById('status-text');
            const actionArea = document.getElementById('action-area');
            const pendingInfo = document.getElementById('pending-info');
            actionArea.innerHTML = '';

            const hasPending = attendances.some(a => !a.synced || a.pending_photo_base64);
            pendingInfo.classList.toggle('hidden', !hasPending);

            if (!record) {
                statusText.textContent = "Belum Absen Masuk";
                actionArea.appendChild(createButton("📍 Absen Masuk", "bg-emerald-500 text-emerald-950", doCheckIn));
            } else if (!record.jam_keluar) {
                statusText.textContent = "Sedang Bekerja";
                actionArea.appendChild(createButton("🛑 Absen Keluar", "bg-rose-500 text-white", doCheckOut));
                actionArea.appendChild(createButton(record.photo_url ? "📸 Ganti Foto" : "📸 Tambah Foto", "bg-slate-800", addPhoto));
            } else {
                statusText.textContent = "Sudah Pulang";
                actionArea.appendChild(createButton(record.photo_url ? "📸 Ganti Foto" : "📸 Tambah Foto", "bg-slate-800", addPhoto));
            }
        }

        function createButton(text, className, onclick) {
            const btn = document.createElement('button');
            btn.className = `w-full py-4 font-bold rounded-3xl ${className} transition-all active:scale-[0.985]`;
            btn.textContent = text;
            btn.onclick = onclick;
            return btn;
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';

            if (attendances.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-8">Belum ada data absensi</p>`;
                return;
            }

            attendances.forEach(record => {
                const div = document.createElement('div');
                div.className = 'bg-slate-900 border border-slate-700 rounded-3xl p-5';
                const isPending = !record.synced || record.pending_photo_base64;

                div.innerHTML = `
                    <div class="flex justify-between">
                        <div>
                            <div class="font-semibold">${record.tanggal}</div>
                            <div class="text-emerald-400 text-sm font-mono">${record.jam_masuk || ''} ${record.jam_keluar ? '→ ' + record.jam_keluar : ''}</div>
                        </div>
                        <div class="text-xs ${isPending ? 'text-amber-400' : 'text-emerald-400'}">${isPending ? 'PENDING' : 'SYNCED'}</div>
                    </div>
                    ${record.photo_url ? `<img src="${record.photo_url}" class="mt-3 w-16 h-16 object-cover rounded-2xl border border-slate-600 cursor-pointer" onclick="showPhoto('${record.photo_url}')">` : ''}
                    ${record.pending_photo_base64 ? `<div class="mt-2 text-xs text-amber-400">📸 Foto tersimpan lokal</div>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function showPhoto(url) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[100]';
            modal.innerHTML = `
                <div class="max-w-lg w-full p-4">
                    <img src="${url}" class="w-full rounded-3xl">
                    <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full py-3 bg-slate-800 rounded-2xl text-white">Tutup</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(`section-${section}`).classList.add('active');
            document.querySelectorAll('[id^="tab-"]').forEach(tab => tab.classList.remove('active', 'bg-emerald-500', 'text-slate-900'));
            document.getElementById(`tab-${section}`).classList.add('active', 'bg-emerald-500', 'text-slate-900');
            if (section === 'riwayat') renderHistory();
        }

        function saveProfile() {
            profile.nama = document.getElementById('nama').value.trim();
            profile.nis = document.getElementById('nis').value.trim();
            profile.kelas = document.getElementById('kelas').value.trim();
            profile.tempat_pkl = document.getElementById('tempat').value.trim();
            saveLocalData();

            if (typeof window.initSyncManager === 'function' && supabaseClient) {
                window.initSyncManager(supabaseClient, profile);
            }
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            alert("Profil berhasil disimpan");
        }

        function updateGreeting() {
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            document.getElementById('nama').value = profile.nama || '';
            document.getElementById('nis').value = profile.nis || '';
            document.getElementById('kelas').value = profile.kelas || '';
            document.getElementById('tempat').value = profile.tempat_pkl || '';
        }

        // ==================== INIT ====================
        async function initApp() {
            initSupabase();
            loadLocalData();
            updateGreeting();
            renderDashboard();
            renderHistory();
            updateNetworkStatus();

            if (typeof window.initSyncManager === 'function' && supabaseClient) {
                window.initSyncManager(supabaseClient, profile);
            }

            window.addEventListener('online', () => {
                updateNetworkStatus();
                if (typeof window.syncPendingRecords === 'function') {
                    setTimeout(() => window.syncPendingRecords(), 1000);
                }
            });
            window.addEventListener('offline', updateNetworkStatus);
            setInterval(updateNetworkStatus, 30000);
        }

        window.onload = initApp;
    </script>
</body>
</html>
