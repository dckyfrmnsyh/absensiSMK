<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi PKL • Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .section { display: none; }
        .section.active { display: block; }
        .nav-tab.active { background-color: #22c55e; color: #0f172a; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <!-- Header -->
    <div class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-xl">📍</div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Absensi PKL</h1>
                    <p class="text-emerald-400 text-xs -mt-1">Supabase + Offline</p>
                </div>
            </div>
            <div id="sync-status" class="text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700">
                Offline
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="max-w-5xl mx-auto px-4 pt-4">
        <div class="flex bg-slate-900 rounded-3xl p-1 border border-slate-800">
            <button onclick="showSection('dashboard')" class="nav-tab flex-1 py-3 text-sm font-bold rounded-3xl active bg-emerald-500 text-slate-900" id="tab-dashboard">Dashboard</button>
            <button onclick="showSection('riwayat')" class="nav-tab flex-1 py-3 text-sm font-bold rounded-3xl text-slate-400" id="tab-riwayat">Riwayat</button>
            <button onclick="showSection('profil')" class="nav-tab flex-1 py-3 text-sm font-bold rounded-3xl text-slate-400" id="tab-profil">Profil</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="section-dashboard" class="section active max-w-5xl mx-auto px-4 pt-6">
        <div class="mb-6">
            <h2 id="greeting" class="text-3xl font-bold">Halo, Siswa!</h2>
            <p class="text-emerald-400 text-sm">Siap absen hari ini?</p>
        </div>

        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 mb-6">
            <div class="flex justify-between mb-4">
                <div>
                    <div class="text-xs text-emerald-400">STATUS HARI INI</div>
                    <div id="status-text" class="text-2xl font-bold">Belum Absen</div>
                </div>
                <div id="status-icon" class="text-5xl">😴</div>
            </div>

            <div id="action-area" class="space-y-3"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="syncToSupabase()" 
                    class="py-4 bg-emerald-500 text-emerald-950 font-bold rounded-3xl text-lg">
                ☁️ Sync ke Supabase
            </button>
            <button onclick="loadFromSupabase()" 
                    class="py-4 bg-slate-800 border border-slate-700 font-bold rounded-3xl text-lg">
                📥 Ambil dari Cloud
            </button>
        </div>
    </div>

    <!-- RIWAYAT -->
    <div id="section-riwayat" class="section max-w-5xl mx-auto px-4 pt-6">
        <h3 class="text-2xl font-bold mb-4">Riwayat Absensi</h3>
        <div id="history-list" class="space-y-3"></div>
    </div>

    <!-- PROFIL -->
    <div id="section-profil" class="section max-w-5xl mx-auto px-4 pt-6">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6">
            <h3 class="text-xl font-bold mb-6">Profil Siswa</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-emerald-400">NAMA LENGKAP</label>
                    <input id="nama" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-emerald-400">NIS</label>
                        <input id="nis" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-emerald-400">KELAS</label>
                        <input id="kelas" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-emerald-400">TEMPAT PKL</label>
                    <input id="tempat" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 mt-1">
                </div>
            </div>

            <button onclick="saveProfile()" class="mt-6 w-full py-4 bg-emerald-500 text-emerald-950 font-bold rounded-3xl">
                Simpan Profil
            </button>
        </div>
    </div>

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://hqoiqoqdqzkkssgoqhpj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxb2lxb3FkcXpra3NzZ29xaHBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNTQ4MzcsImV4cCI6MjA5NjYzMDgzN30.8KRYBV-t47ca08Q8G4yqn3bfVLPFEE9PDIrtAfbpVnE';
        
        let supabaseClient = null;
        let profile = { nama: "Siswa PKL", nis: "", kelas: "", tempat_pkl: "" };
        let attendances = [];

        // ==================== INIT ====================
        function initSupabase() {
            if (typeof window.supabase === 'undefined') {
                console.error("Supabase library not loaded");
                return;
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("%c[Supabase] Connected", "color:#3ecf8e");
        }

        function loadLocalData() {
            const savedProfile = localStorage.getItem('pkl_profile');
            if (savedProfile) profile = JSON.parse(savedProfile);

            const savedAttendances = localStorage.getItem('pkl_attendances');
            if (savedAttendances) attendances = JSON.parse(savedAttendances);
        }

        function saveLocalData() {
            localStorage.setItem('pkl_profile', JSON.stringify(profile));
            localStorage.setItem('pkl_attendances', JSON.stringify(attendances));
        }

        // ==================== SUPABASE SYNC ====================
        async function syncToSupabase() {
            if (!supabaseClient) {
                alert("Supabase belum terhubung");
                return;
            }

            const unsynced = attendances.filter(a => !a.synced);
            if (unsynced.length === 0) {
                alert("Semua data sudah tersinkron");
                return;
            }

            for (const record of unsynced) {
                try {
                    const { error } = await supabaseClient
                        .from('attendances')
                        .upsert({
                            id: record.id,
                            student_nis: profile.nis,
                            student_name: profile.nama,
                            tanggal: record.tanggal,
                            jam_masuk: record.jam_masuk,
                            jam_keluar: record.jam_keluar,
                            lat: record.lat,
                            lng: record.lng,
                            status_masuk: record.status_masuk,
                            photo_url: record.photo_url || null
                        });

                    if (!error) {
                        record.synced = true;
                    }
                } catch (e) {
                    console.error("Sync error:", e);
                }
            }

            saveLocalData();
            renderHistory();
            alert(`${unsynced.length} data berhasil di-sync ke Supabase!`);
        }

        async function loadFromSupabase() {
            if (!supabaseClient) return;

            const { data, error } = await supabaseClient
                .from('attendances')
                .select('*')
                .order('tanggal', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            // Merge data dari Supabase ke local
            data.forEach(cloudRecord => {
                const localIndex = attendances.findIndex(a => a.id === cloudRecord.id);
                if (localIndex === -1) {
                    attendances.push({
                        ...cloudRecord,
                        synced: true
                    });
                } else {
                    attendances[localIndex] = {
                        ...cloudRecord,
                        synced: true
                    };
                }
            });

            saveLocalData();
            renderHistory();
            alert("Data berhasil diambil dari Supabase");
        }

        // ==================== PHOTO ====================
        async function addPhoto() {
            const record = getTodayRecord();
            if (!record) {
                alert("Absen dulu baru bisa tambah foto");
                return;
            }

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!supabaseClient) {
                    alert("Supabase belum siap. Foto disimpan lokal.");
                    return;
                }

                const fileName = `absen-${record.id}-${Date.now()}.jpg`;
                const { data, error } = await supabaseClient.storage
                    .from('photos')
                    .upload(fileName, file);

                if (error) {
                    alert("Gagal upload foto");
                    return;
                }

                const { data: urlData } = supabaseClient.storage
                    .from('photos')
                    .getPublicUrl(fileName);

                record.photo_url = urlData.publicUrl;
                record.synced = false;

                saveLocalData();
                renderDashboard();
                renderHistory();
                alert("Foto berhasil diupload ke Supabase Storage!");
            };

            input.click();
        }

        // ==================== ATTENDANCE ====================
        function getTodayRecord() {
            const today = new Date().toISOString().split('T')[0];
            return attendances.find(a => a.tanggal === today);
        }

        function doCheckIn() {
            const today = new Date().toISOString().split('T')[0];
            if (getTodayRecord()) {
                alert("Sudah absen hari ini");
                return;
            }

            const now = new Date();
            const record = {
                id: Date.now(),
                tanggal: today,
                jam_masuk: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                jam_keluar: null,
                lat: null,
                lng: null,
                status_masuk: "Hadir",
                photo_url: null,
                synced: false
            };

            attendances.unshift(record);
            saveLocalData();
            renderDashboard();
            renderHistory();
        }

        function doCheckOut() {
            const record = getTodayRecord();
            if (!record || record.jam_keluar) return;

            const now = new Date();
            record.jam_keluar = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            record.synced = false;

            saveLocalData();
            renderDashboard();
            renderHistory();
        }

        // ==================== RENDER ====================
        function renderDashboard() {
            const record = getTodayRecord();
            const statusText = document.getElementById('status-text');
            const actionArea = document.getElementById('action-area');
            actionArea.innerHTML = '';

            if (!record) {
                statusText.textContent = "Belum Absen Masuk";
                const btn = createButton("📍 Absen Masuk", "bg-emerald-500 text-emerald-950", doCheckIn);
                actionArea.appendChild(btn);
            } else if (!record.jam_keluar) {
                statusText.textContent = "Sedang Bekerja";
                const btnOut = createButton("🛑 Absen Keluar", "bg-rose-500 text-white", doCheckOut);
                actionArea.appendChild(btnOut);

                const btnPhoto = createButton(record.photo_url ? "📸 Ganti Foto" : "📸 Tambah Foto", "bg-slate-800", addPhoto);
                actionArea.appendChild(btnPhoto);
            } else {
                statusText.textContent = "Sudah Pulang";
                const btnPhoto = createButton(record.photo_url ? "📸 Ganti Foto" : "📸 Tambah Foto", "bg-slate-800", addPhoto);
                actionArea.appendChild(btnPhoto);
            }
        }

        function createButton(text, className, onclick) {
            const btn = document.createElement('button');
            btn.className = `w-full py-4 font-bold rounded-3xl ${className}`;
            btn.textContent = text;
            btn.onclick = onclick;
            return btn;
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';

            if (attendances.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-8">Belum ada data absensi</p>`;
                return;
            }

            attendances.forEach(record => {
                const div = document.createElement('div');
                div.className = 'bg-slate-900 border border-slate-700 rounded-3xl p-5';
                div.innerHTML = `
                    <div class="flex justify-between">
                        <div>
                            <div class="font-semibold">${record.tanggal}</div>
                            <div class="text-emerald-400 text-sm font-mono">${record.jam_masuk} ${record.jam_keluar ? '→ ' + record.jam_keluar : ''}</div>
                        </div>
                        <div class="text-xs ${record.synced ? 'text-emerald-400' : 'text-amber-400'}">
                            ${record.synced ? 'SYNCED' : 'BELUM SYNC'}
                        </div>
                    </div>
                    ${record.photo_url ? `
                        <img src="${record.photo_url}" class="mt-3 w-16 h-16 object-cover rounded-2xl border border-slate-600 cursor-pointer" 
                             onclick="showPhoto('${record.photo_url}')">
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function showPhoto(url) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[100]';
            modal.innerHTML = `
                <div class="max-w-lg w-full p-4">
                    <img src="${url}" class="w-full rounded-3xl">
                    <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full py-3 text-white">Tutup</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(`section-${section}`).classList.add('active');

            document.querySelectorAll('[id^="tab-"]').forEach(tab => {
                tab.classList.remove('active', 'bg-emerald-500', 'text-slate-900');
                if (tab.id === `tab-${section}`) {
                    tab.classList.add('active', 'bg-emerald-500', 'text-slate-900');
                }
            });

            if (section === 'riwayat') renderHistory();
        }

        function saveProfile() {
            profile.nama = document.getElementById('nama').value;
            profile.nis = document.getElementById('nis').value;
            profile.kelas = document.getElementById('kelas').value;
            profile.tempat_pkl = document.getElementById('tempat').value;

            saveLocalData();
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            alert("Profil berhasil disimpan");
        }

        function updateGreeting() {
            document.getElementById('greeting').textContent = `Halo, ${profile.nama || 'Siswa'}!`;
            document.getElementById('nama').value = profile.nama || '';
            document.getElementById('nis').value = profile.nis || '';
            document.getElementById('kelas').value = profile.kelas || '';
            document.getElementById('tempat').value = profile.tempat_pkl || '';
        }

        function initApp() {
            initSupabase();
            loadLocalData();
            updateGreeting();
            renderDashboard();
            renderHistory();

            // Auto sync when online
            window.addEventListener('online', () => {
                console.log("Back online - attempting auto sync...");
                syncToSupabase();
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
